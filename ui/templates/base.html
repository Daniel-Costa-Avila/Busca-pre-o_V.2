<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Price Monitor Console{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ assets_version | default('1') }}">
    {# Bloco para metas pontuais (ex.: auto-refresh na tela de status). #}
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}theme-apple density-comfortable{% endblock %}">
<div class="noise-layer"></div>
<div class="ambient ambient-a"></div>
<div class="ambient ambient-b"></div>

{% block body %}{% endblock %}

{% block scripts %}{% endblock %}
</body>
</html>
