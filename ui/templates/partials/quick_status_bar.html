{# Barra de status rapido = apenas status operacional (API / Job / Tempo). #}
<section class="quick-status glass reveal" aria-label="Status rapido">
    <div class="quick-status-left">
        <p class="kicker">Status operacional</p>
        <span class="quick-status-title">Saude, execucao e tempo</span>
    </div>
    <div class="chip-row quick-status-right" aria-label="Indicadores">
        <span id="chip-api" class="chip chip-pending">API: verificando</span>
        <span id="chip-job" class="chip chip-pending">Job: -</span>
        <span id="chip-time" class="chip chip-neutral">--:--:--</span>
    </div>
</section>
